apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace-istio-ingress.yaml
  - namespace-istio-system.yaml
  - namespace-istio-egress.yaml

helmCharts:

  # Istio control plane
  - name: istiod
    repo: https://istio-release.storage.googleapis.com/charts
    version: "1.30.3"
    releaseName: istiod
    namespace: istio-system
    valuesInline:
      global:
        hub: docker.io/istio
        tag: "1.30.3"
      meshConfig:
        accessLogFile: /dev/stdout

  # Istio ingress gateway
  - name: gateway
    repo: https://istio-release.storage.googleapis.com/charts
    version: "1.30.3"
    releaseName: gateway
    namespace: istio-ingress

  # Istio egress gateway
  - name: gateway
    repo: https://istio-release.storage.googleapis.com/charts
    version: "1.30.3"
    releaseName: istio-egressgateway
    namespace: istio-egress
