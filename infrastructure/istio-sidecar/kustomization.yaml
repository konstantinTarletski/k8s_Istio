apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: istio-system

helmCharts:

  # Istio base
  - name: base
    repo: https://istio-release.storage.googleapis.com/charts
    version: "1.30.3"
    releaseName: istio-base
    namespace: istio-system

  # Istio control plane
  - name: istiod
    repo: https://istio-release.storage.googleapis.com/charts
    version: "1.30.3"
    releaseName: istiod
    namespace: istio-system
    valuesInline:
      global:
        hub: docker.io/istio
        tag: "1.30.3"
      meshConfig:
        accessLogFile: /dev/stdout

  # Istio ingress gateway
  - name: gateway
    repo: https://istio-release.storage.googleapis.com/charts
    version: "1.30.3"
    releaseName: gateway
    namespace: istio-system

  # Istio egress gateway
  #- name: gateway
  #  repo: https://istio-release.storage.googleapis.com/charts
  #  version: "1.30.3"
  #  releaseName: istio-egressgateway
  #  namespace: istio-system

  - name: kiali-server
    repo: https://kiali.org/helm-charts
    version: "2.28.0"
    releaseName: kiali
    namespace: istio-system
    valuesInline:
      auth:
        strategy: anonymous

resources:
  - namestace-istio-system.yaml
  - ingress-kiali.yaml