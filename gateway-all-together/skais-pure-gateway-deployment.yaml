apiVersion: apps/v1
kind: Deployment
metadata:
  name: skais-pure-gateway
  namespace: skais-2-test
spec:
  selector:
    matchLabels:
      app: skais-pure-gateway
  template:
    metadata:
      labels:
        app: skais-pure-gateway
        istio: ingressgateway # Matches the Gateway selector!
    spec:
      containers:
        - name: istio-proxy
          image: gcr.io/istio-release/proxyv2:1.22.0 # Use your current istioctl version
          args:
            - proxy
            - router
            - --domain
            - $(POD_NAMESPACE).svc.cluster.local
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INSTANCE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP